name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # The organization's CI uses no personal access token (lambda-script/
    # shared-workflows README「CI の秘密の方針」). This public repository cannot
    # read the organization App's key, so release-please runs on GITHUB_TOKEN.
    # Events made with GITHUB_TOKEN start no other workflow, so the publish runs
    # as the next job of this workflow instead of on the release event.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@lambda-script/vite-plugin-worktree-hmr
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node 22.14.0+ and npm CLI 11.5.1+ (docs.npmjs.com/trusted-publishers, 2026-11-13).
          node-version: 22.21.1
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: "@lambda-script"

      - name: Use an npm CLI that supports trusted publishing
        run: npm install -g npm@11.21.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Trusted publishing: npm exchanges this job's OIDC token (id-token: write)
      # for a short-lived publish credential, so no npm token is stored. npmjs.com
      # trusts only this repository, release-please.yml and the npm-publish Environment.
      - name: Publish to npm
        run: npm publish --access public --provenance
