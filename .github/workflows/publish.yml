name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    uses: lambda-script/shared-workflows/.github/workflows/npm-publish.yml@0105af4e12ad593ecaf9d4bef668315f887581cf # v1
    with:
      package_manager: pnpm
      node_version: "22"
      scope: "@lambda-script"
    secrets:
      npm_token: ${{ secrets.NPM_TOKEN }}
