name: Publish to npm

on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@lambda-script/vite-plugin-worktree-hmr
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node 22.14.0+ and npm CLI 11.5.1+ (docs.npmjs.com/trusted-publishers, 2026-11-13).
          node-version: 22.21.1
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: "@lambda-script"

      - name: Use an npm CLI that supports trusted publishing
        run: npm install -g npm@11.21.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Trusted publishing: npm exchanges this job's OIDC token (id-token: write)
      # for a short-lived publish credential, so no npm token is stored. npmjs.com
      # trusts only this repository, publish.yml and the npm-publish Environment.
      - name: Publish to npm
        run: npm publish --access public --provenance
